name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="walkline_${GITHUB_REF#refs/tags/v}_${GOOS}_${GOARCH}${ext}"
          go build -ldflags="-s -w" -o "$name" ./cmd/walkline

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          base="walkline_${GITHUB_REF#refs/tags/v}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            mv "${base}.exe" walkline.exe
            zip "${base}.zip" walkline.exe
          else
            mv "${base}" walkline
            tar czf "${base}.tar.gz" walkline
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: walkline_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            walkline_*.tar.gz
            walkline_*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum walkline_*.tar.gz walkline_*.zip > checksums.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/walkline_*.tar.gz
            dist/walkline_*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
