name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="walkline_${VERSION#v}_${GOOS}_${GOARCH}${ext}"
          go build -ldflags="-s -w -X walkline/internal/constants.Version=${VERSION#v}" -o "$name" ./cmd/walkline
          # Smoke test: the binary we can run must report the tag it was built from (not "dev").
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "amd64" ]; then
            test "$(./$name --version)" = "${VERSION#v}"
          fi

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          base="walkline_${VERSION#v}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            mv "${base}.exe" walkline.exe
            zip "${base}.zip" walkline.exe
          else
            mv "${base}" walkline
            tar czf "${base}.tar.gz" walkline
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: walkline_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            walkline_*.tar.gz
            walkline_*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum walkline_*.tar.gz walkline_*.zip > checksums.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/walkline_*.tar.gz
            dist/walkline_*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
