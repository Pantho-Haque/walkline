name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Print build env
        run: go env CGO_ENABLED GOOS GOARCH

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          name="walkline_${GITHUB_REF#refs/tags/v}_${GOOS}_${GOARCH}${ext}"
          go build -ldflags="-s -w" -o "$name" ./cmd/walkline

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=".tar.gz"
          if [ "$GOOS" = "windows" ]; then
            ext=".zip"
          fi
          name="walkline_${GITHUB_REF#refs/tags/v}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            zip "${name}${ext}" "walkline_${name#walkline_}"*.exe
          else
            tar czf "${name}${ext}" "walkline_${name#walkline_}"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: walkline_*.tar.gz walkline_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          sha256sum walkline_*.tar.gz walkline_*.zip > checksums.txt

      - name: Upload checksums
        uses: softprops/action-gh-release@v1
        with:
          files: checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
